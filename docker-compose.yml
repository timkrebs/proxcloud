services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-proxcloud}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-proxcloud}
      - POSTGRES_DB=${POSTGRES_DB:-proxcloud}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxcloud} -d ${POSTGRES_DB:-proxcloud}"]
      interval: 10s
      timeout: 3s
      retries: 6

  backend:
    build:
      context: ./backend
      target: dev
    command: air
    volumes:
      - ./backend:/app
    env_file: .env
    extra_hosts:
      - "pve01.proxcloud.lab:192.168.1.128"
    environment:
      # Container always binds :8080; host port configurable (BACKEND_PORT).
      - LISTEN_ADDR=:8080
      # Points at the postgres service (overrides any DATABASE_URL in .env).
      - DATABASE_URL=postgres://${POSTGRES_USER:-proxcloud}:${POSTGRES_PASSWORD:-proxcloud}@postgres:5432/${POSTGRES_DB:-proxcloud}?sslmode=disable
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_ORIGIN=http://backend:8080
      - NEXT_PUBLIC_BACKEND_WS_ORIGIN=ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
