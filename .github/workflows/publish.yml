# publish — build + push the immutable image set to GHCR (ADR-0014 §1/§2/§3/§7).
#
# TRUST BOUNDARY: this is the ONLY workflow that holds `packages: write` /
# `id-token: write`. It runs via `workflow_run` on a *completed, successful*
# `ci.yml` run of the BASE repo — a fork PR can trigger ci.yml but can never
# reach here (workflow_run only fires for base-repo workflows). See ADR-0014 §2.
#
# What it does, and the rules it must never break:
#   - Resolves the IMMUTABLE commit from `workflow_run.head_sha` (regex-validated
#     on the runner) and builds *that exact tree* — never a branch, never latest.
#   - Tags: the full 40-char git SHA ALWAYS; the semver ONLY on `v*` tag runs.
#     `latest` is NEVER produced (flavor latest=false) — deploy resolves by SHA.
#   - `--target prod`; build-args SHA / SEMVER / BUILDTIME match both Dockerfiles
#     (these feed internal/version via -ldflags and the OCI image labels).
#   - SBOM per image (syft) uploaded as a workflow artifact.
#   - cosign keyless signing (OIDC) of the pushed digest — BEST-EFFORT: it runs
#     after the push and is `continue-on-error` so a Sigstore hiccup can never
#     block an already-published, immutable image set (see RELEASING.md).
#
# SECURITY (ADR-0014 §7): every third-party action is pinned by commit SHA with
# the human tag in a comment; no untrusted `github.event.*` is interpolated into
# any `run:` — the head_sha/head_branch flow through `env:` and are format-
# validated (`^[0-9a-f]{40}$`) before anything is built or tagged.
name: publish

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

# Least privilege for a publishing workflow: read the tree, write packages, and
# request an OIDC token for cosign keyless signing. Nothing else.
permissions:
  contents: read
  packages: write
  id-token: write

# Keyed on the immutable head_sha, never aborted mid-push: a half-pushed image
# set must not exist. A second run for the same SHA queues; it never cancels one.
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  # ── prepare: gate on the trigger + resolve/validate the build coordinates ────
  # No checkout, no registry access — just the guard and the coordinate math, so
  # the credential-bearing publish job only ever runs on a validated SHA.
  prepare:
    # Only a green ci.yml run that was a PUSH to THIS repo's `main` or a `v*` ref
    # may publish. The trust boundary (ADR-0014 §2) lives here: head_branch is
    # attacker-controlled for a fork PR, so it is NEVER trusted alone — we first
    # require the triggering run to be a base-repo push (event == 'push' AND
    # head_repository == this repo), which no fork PR can satisfy. PR ci runs and
    # failed runs are dropped here, before the credential-bearing publish job.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.coords.outputs.head_sha }}
      short_sha: ${{ steps.coords.outputs.short_sha }}
      semver: ${{ steps.coords.outputs.semver }}
      is_tag: ${{ steps.coords.outputs.is_tag }}
      buildtime: ${{ steps.coords.outputs.buildtime }}
    steps:
      - name: Resolve and validate build coordinates
        id: coords
        # Untrusted event fields enter ONLY via env: (never inlined into the
        # script body) and are regex-validated before they become build inputs.
        env:
          RAW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RAW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # The one non-negotiable: build an immutable 40-char commit, not a ref.
          if [[ ! "$RAW_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::refusing to publish: head_sha is not a 40-char git SHA" >&2
            exit 1
          fi

          {
            echo "head_sha=$RAW_HEAD_SHA"
            echo "short_sha=${RAW_HEAD_SHA:0:12}"
            echo "buildtime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

          # Semver ONLY when the triggering ci run was a v* tag push; otherwise a
          # short-sha-stamped dev version (no semver docker tag is emitted).
          if [[ "$RAW_HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            {
              echo "semver=$RAW_HEAD_BRANCH"
              echo "is_tag=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "semver=0.0.0-dev+${RAW_HEAD_SHA:0:12}"
              echo "is_tag=false"
            } >> "$GITHUB_OUTPUT"
          fi

  # ── publish: build + push + SBOM + sign, one leg per image, in parallel ──────
  # fail-fast:false so one image's failure does not abort the other's push; but a
  # failed leg still fails the run, so a HALF-published set never triggers deploy.
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ghcr.io/timkrebs/proxcloud-backend
          - name: frontend
            context: ./frontend
            image: ghcr.io/timkrebs/proxcloud-frontend
    steps:
      - name: Checkout the exact published commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # workflow_run defaults to the default-branch tip; pin to the validated
          # head_sha so what we build is exactly what CI went green on.
          ref: ${{ needs.prepare.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR (built-in token — no PAT)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ matrix.image }}
          # NEVER latest — deploy resolves by SHA; latest is not a deploy source.
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.head_sha }}
            type=raw,value=${{ needs.prepare.outputs.semver }},enable=${{ needs.prepare.outputs.is_tag == 'true' }}
          # Override the ref-derived defaults (which would carry the wrong
          # revision in workflow_run) with the validated head_sha coordinates.
          labels: |
            org.opencontainers.image.source=https://github.com/timkrebs/proxcloud
            org.opencontainers.image.revision=${{ needs.prepare.outputs.head_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.semver }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.buildtime }}
            org.opencontainers.image.title=proxcloud-${{ matrix.name }}

      - name: Build and push (immutable SHA tag; semver on v* only; never latest)
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ${{ matrix.context }}
          target: prod
          push: true
          # Plain single-arch image manifest: predictable digest for syft + cosign
          # (SBOM is produced separately below, not as a buildx attestation).
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SHA=${{ needs.prepare.outputs.head_sha }}
            SEMVER=${{ needs.prepare.outputs.semver }}
            BUILDTIME=${{ needs.prepare.outputs.buildtime }}

      - name: Generate SBOM (syft) and upload as an artifact
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}-${{ needs.prepare.outputs.short_sha }}.spdx.json
          upload-artifact: true
          # Pull the just-pushed (private-by-default) image with the built-in token.
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      # ── cosign keyless signing — BEST-EFFORT supply-chain hardening ──────────
      # Enabled: id-token is available and the GHCR login is already in the docker
      # config, so keyless (OIDC → Fulcio → Rekor) signs the pushed digest cleanly.
      # continue-on-error keeps a Sigstore/Rekor outage from failing an
      # already-published, immutable image set (task rule: never block publish).
      # To disable: comment out both steps below and note it in RELEASING.md.
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign the pushed digest (keyless OIDC)
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Job summary
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo "### Published \`${IMAGE}\`"
            echo ""
            echo "- digest: \`${DIGEST}\`"
            echo "- tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
