# Generates the frontend's API wire types from backend/api/types — the
# single source of truth shared between Go and TypeScript.
# Run from backend/:  go run github.com/gzuidhof/tygo generate
packages:
  - path: "github.com/timkrebs9/proxcloud/backend/api/types"
    output_path: "../frontend/src/lib/api/generated/types.ts"
    frontmatter: |
      // Code generated by tygo from backend/api/types — DO NOT EDIT.
      // Regenerate: cd backend && go run github.com/gzuidhof/tygo generate
    type_mappings:
      time.Time: "string /* RFC3339 */"
