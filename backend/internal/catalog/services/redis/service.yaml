# Redis — a Phase-D catalog service on the Phase-A/C rails (ADR-0026 schema).
#
# This definition is CODE: it ships embedded in the backend binary via
# //go:embed (internal/catalog/catalog.go) and is validated at startup. A
# malformed field fails the process boot, never a half-provisioned guest.
#
# It mirrors the PostgreSQL reference: kind single, qemu, ONE injected
# credential. Redis `requirepass` has NO username (it is a shared password, not
# an account), so the credential is modelled honestly as a password-only,
# fixed-username credential: usernameSettable is false and the template never
# uses a username. See internal/catalog/README.md and ADR-0027 §1.
id: redis
displayName: Redis
description: In-memory data store / cache (Redis on Ubuntu 24.04 LTS), password-protected.
icon: database
category: cache

# kind: single provisions ONE guest (ADR-0026). `set` is reserved for
# multi-guest services (Phase E) and rejected by the loader in v1.
kind: single
# guestType: qemu — cloud-init user-data (packages/runcmd) is a VM-only path
# (ADR-0025 §v1 scope; docs/proxmox/cloud-init.md §2). LXC is not supported.
guestType: qemu

baseImage:
  # Storage-scoped volid of the Ubuntu 24.04 cloud image prod already imports
  # (deploy/terraform: ubuntu-24.04-server-cloudimg-amd64.img →
  # proxcloud-ubuntu-24.04.img on the image datastore).
  ref: "local:iso/proxcloud-ubuntu-24.04.img"

sizing:
  default:
    cores: 1
    memoryMb: 1024
    diskGb: 8
  min:
    cores: 1
    memoryMb: 512
    diskGb: 8

# The injected credential: Redis `requirepass`. Redis has no username for the
# shared password (the ACL "default" user), so usernameSettable is false and the
# username field is unused by the template. `userSettable` lets the wizard set
# the password (Phase C); `generatedDefault` mints a strong secret when blank.
credentials:
  - name: requirepass
    usernameSettable: false
    userSettable: true
    generatedDefault: true

# Default service port(s) — informational + firewall hints (ADR-0026).
ports:
  - 6379

# Completion probe target consumed by the deploy engine's `configuring` step
# (ADR-0028). Never hardcode a port in the engine — this is the single source.
readiness: "tcp:6379"

docs: "https://redis.io/docs/latest/"

# YYYY-MM-DD this definition was last verified against a real PVE (9.2.4).
testedOn: "2026-08-28"
