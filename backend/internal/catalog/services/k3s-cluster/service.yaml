# K3s cluster — the Phase-E reference SET service (ADR-0029/0030).
#
# This definition is CODE: it ships embedded in the backend binary via
# //go:embed (internal/catalog/catalog.go) and is validated at startup. A
# malformed field fails the process boot, never a half-provisioned cluster.
#
# Unlike a kind:single service, a kind:set service provisions N linked guests as
# ONE deployment set (ADR-0029): here a single K3s control-plane node ('server',
# count 1) plus worker nodes ('agent', default 2, adjustable within the tenant/
# project quota the atomic batch reservation enforces). Each role ships its OWN
# cloud-init template (<role>.cloud-init.yaml.tftpl); there is no single
# cloud-init.yaml.tftpl.
id: k3s-cluster
displayName: K3s Cluster
description: Lightweight Kubernetes (K3s) — one control-plane node plus worker nodes, provisioned as a cluster on Ubuntu 24.04 LTS.
icon: kubernetes
category: orchestration

kind: set
guestType: qemu

baseImage:
  # Same Ubuntu 24.04 cloud image the single-guest services import
  # (deploy/terraform: proxcloud-ubuntu-24.04.img on the image datastore).
  ref: "local:iso/proxcloud-ubuntu-24.04.img"

# Member roles (ADR-0030). The control plane is a single node in v1 (no HA); the
# worker count is operator-chosen within [min, max]. Each role carries its own
# per-member sizing.
roles:
  - name: server
    count: 1
    min: 1
    max: 1
    sizing:
      default: { cores: 2, memoryMb: 4096, diskGb: 20 }
      min: { cores: 2, memoryMb: 2048, diskGb: 16 }
  - name: agent
    count: 2
    min: 1
    max: 10
    sizing:
      default: { cores: 2, memoryMb: 4096, diskGb: 20 }
      min: { cores: 1, memoryMb: 2048, diskGb: 16 }

# EMPTY credential schema (ADR-0027 §4, the "no stored service credentials" case):
# the cluster's join secret (K3S_TOKEN) is GENERATED by the backend with
# crypto/rand and injected only via the base64 transport into each member's
# snippet — never user-set, never stored, never revealed. There is nothing here
# for the wizard to collect.
credentials: []

# The Kubernetes API / join port — informational + the readiness probe target.
ports:
  - 6443

# Completion probe: the set is 'ready' only when the server's API answers on 6443
# and every agent's configuring step passes (ADR-0028/0030).
readiness: "tcp:6443"

docs: "https://docs.k3s.io/"

# YYYY-MM-DD this definition was last verified against a real PVE (9.2.4).
testedOn: "2026-08-28"
